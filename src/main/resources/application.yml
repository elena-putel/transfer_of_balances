spring:
  application:
    name: transfer-of-balances
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:transfer_balances}
    username: ${DB_USER:transfer_user}
    password: ${DB_PASSWORD:transfer_pass}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

transfer:
  input-directory: ${TRANSFER_INPUT_DIR:/data/incoming}
  processed-directory: ${TRANSFER_PROCESSED_DIR:/data/processed}
  error-directory: ${TRANSFER_ERROR_DIR:/data/error}
  report-suffix: r
  file-extension: ".045"
  data-file-prefix: epb
  default-cust-code: 1
  default-type-serv-a: 326
  default-cod-oper: 45
  summa-scale: 4
  scheduled:
    enabled: ${TRANSFER_SCHEDULE_ENABLED:false}
    cron: "0 */5 * * * *"

resilience4j:
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.hibernate.exception.JDBCConnectionException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.beltelecom.transfer: INFO
    org.hibernate.SQL: WARN
