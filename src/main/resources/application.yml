spring:
  application:
    name: transfer-of-balances
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:10.247.16.58}:${DB_PORT:5432}/${DB_NAME:transfer_balances}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:admin}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

informix:
  datasource:
    enabled: ${INFORMIX_ENABLED:true}
    url: ${INFORMIX_URL:jdbc:informix-sqli://10.247.12.130:1525/sprav:INFORMIXSERVER=i_minskcvk;DB_LOCALE=ru_RU.866;CLIENT_LOCALE=ru_RU.utf8}
    username: ${INFORMIX_USER:javaprog}
    password: ${INFORMIX_PASSWORD:jdk601}
    driver-class-name: com.informix.jdbc.IfxDriver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: informix-pool

transfer:
  input-directory: ${TRANSFER_INPUT_DIR:/data/incoming}
  processed-directory: ${TRANSFER_PROCESSED_DIR:/data/processed}
  error-directory: ${TRANSFER_ERROR_DIR:/data/error}
  protocol-directory: ${TRANSFER_PROTOCOL_DIR:}
  software-version: ${TRANSFER_SOFTWARE_VERSION:1.0.0}
  report-suffix: r
  file-extension: ".045"
  data-file-prefix: epb
  default-in-out: 1
  default-code-adm: 1
  default-cust-code: 1
  default-type-serv-a: 326
  default-cod-oper: 45
  summa-scale: 4
  scheduled:
    enabled: ${TRANSFER_SCHEDULE_ENABLED:false}
    cron: "0 */5 * * * *"

resilience4j:
  retry:
    instances:
      database:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
        retry-exceptions:
          - org.springframework.dao.DataAccessException
          - org.hibernate.exception.JDBCConnectionException

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: ${SERVER_PORT:8080}

logging:
  level:
    com.beltelecom.transfer: INFO
    org.hibernate.SQL: WARN
